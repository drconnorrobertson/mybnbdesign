name: Cross-link Pages
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crosslink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run cross-linking script
        run: python scripts/crosslink.py
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add contextual cross-links to all pages"
          git push
